server:
  port: ${PORT:3000}
  shutdown: graceful
spring:
  application:
    name: travel-ai-backend
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 2000
      initialization-fail-timeout: -1
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-secure-32-byte-minimum-secret}
    expires-in: ${JWT_EXPIRES_IN:7d}
  cors-origin: ${CORS_ORIGIN:http://localhost}
  llm:
    provider: ${LLM_PROVIDER:siliconflow}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:Qwen/Qwen2.5-72B-Instruct}
    base-url: ${LLM_BASE_URL:https://api.siliconflow.cn/v1}
    temperature: ${LLM_TEMPERATURE:0.7}
    max-tokens: ${LLM_MAX_TOKENS:4096}
  ai:
    max-concurrency: ${AI_MAX_CONCURRENCY:5}
    timeout-ms: ${AI_TIMEOUT_MS:120000}
    stall-ms: ${AI_STALL_MS:30000}
    rate-capacity: ${AI_RATE_CAPACITY:10}
    rate-refill-per-sec: ${AI_RATE_REFILL:0.1667}
    cache-max: ${AI_CACHE_MAX:100}
    cache-ttl-ms: ${AI_CACHE_TTL_MS:600000}
