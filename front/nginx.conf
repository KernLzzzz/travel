# ============================================================
#  前端站点配置
#  由 Nginx 主配置在 http{} 块中引入，因此这里只写 server 块
# ============================================================

# 上游后端服务；docker-compose 中服务名即主机名
upstream backend {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------- 基础安全响应头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================
    #  API 反向代理
    # ============================================================
    location /api/ {
        proxy_pass http://backend;

        # HTTP/1.1 + 清空 Connection 头：启用与上游的长连接复用
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== SSE 流式输出的三个关键开关 =====
        # 1) 关闭代理缓冲：否则 Nginx 会攒满缓冲区再下发，
        #    前端看到的就不是逐字输出，而是最后一次性刷出全部内容
        proxy_buffering off;
        proxy_cache off;
        # 2) 关闭 gzip：压缩同样会引入缓冲，破坏流式实时性
        gzip off;
        # 3) 放宽读超时：AI 生成行程可能持续数十秒，
        #    默认的 60s 会掐断连接（后端 AI_TIMEOUT_MS 默认 120s，这里留足余量）
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ---------- 带内容指纹的构建产物：长期强缓存 ----------
    # Vite 输出的 assets/xxx-[hash].js 内容不变则文件名不变
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- index.html 禁止缓存 ----------
    # 保证发版后用户刷新即可拿到新的资源入口，不会因旧 HTML 引用已删除的文件而白屏
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- SPA history 路由回退 ----------
    # Vue Router 使用 history 模式，/chat、/my 等路径在磁盘上并不存在，
    # 必须回退到 index.html 交给前端路由处理，否则刷新页面直接 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 错误页 ----------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
